<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>El Sabroso — Branch Inventory</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --charcoal-900:#181310;
  --charcoal-800:#241d18;
  --charcoal-700:#372c24;
  --charcoal-600:#4a3c30;
  --cream:#FBF6EC;
  --cream-dim:#F1E7D4;
  --ember:#E8552A;
  --ember-dark:#C23D17;
  --ember-light:#FBDCC9;
  --flame:#F5A623;
  --green:#3F8F5C;
  --green-light:#E4F3E9;
  --blue:#3B6FA0;
  --blue-light:#E4EDF5;
  --amber:#D98E1F;
  --amber-light:#FBEED4;
  --red:#C0392B;
  --red-light:#F8E2DF;
  --line: rgba(24,19,16,0.12);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--charcoal-900);font-family:var(--font-body);color:var(--charcoal-900);-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;display:flex;justify-content:center;}
#app-outer{width:100%;max-width:440px;min-height:100vh;background:var(--cream);position:relative;box-shadow:0 0 60px rgba(0,0,0,0.5);}
@media (min-width:441px){
  body{align-items:flex-start;padding:28px 0;}
  #app-outer{min-height:calc(100vh - 56px);border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.55);}
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;}
::placeholder{color:#9c8f80;}

/* ---------- utility ---------- */
.hide{display:none !important;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember-dark);font-weight:600;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;}
.pill.pending{background:var(--amber-light);color:var(--amber);}
.pill.approved{background:var(--blue-light);color:var(--blue);}
.pill.delivery{background:#FCE6DA;color:var(--ember-dark);}
.pill.received{background:var(--green-light);color:var(--green);}
.pill.rejected{background:var(--red-light);color:var(--red);}

/* ---------- loading ---------- */
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--charcoal-900);color:var(--cream-dim);gap:14px;}
.ember-spin{font-size:34px;animation:flicker 1.1s infinite ease-in-out;}
@keyframes flicker{0%,100%{transform:scale(1) translateY(0);opacity:1;}50%{transform:scale(1.15) translateY(-2px);opacity:.75;}}

/* ---------- login ---------- */
.login-screen{min-height:100vh;background:radial-gradient(120% 100% at 50% 0%, var(--charcoal-700) 0%, var(--charcoal-900) 65%);display:flex;flex-direction:column;justify-content:center;padding:36px 26px;color:var(--cream);}
.login-logo{display:block;width:150px;height:150px;margin:0 auto 18px;object-fit:contain;filter:drop-shadow(0 8px 22px rgba(0,0,0,0.45));}
.role-toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--charcoal-800);border-radius:12px;padding:4px;gap:4px;margin-bottom:22px;}
.role-btn{padding:11px 2px;border-radius:9px;font-weight:600;font-size:12.5px;color:#c9baa8;transition:.15s;}
.role-btn.active{background:var(--ember);color:#fff;}
.field-label{font-size:12px;font-weight:600;color:#c9baa8;margin-bottom:6px;display:block;letter-spacing:.02em;}
.login-select,.login-input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid rgba(255,255,255,0.14);background:var(--charcoal-800);color:var(--cream);font-size:15px;margin-bottom:16px;}
.login-select:focus,.login-input:focus{outline:2px solid var(--ember);outline-offset:0;}
.btn-primary{width:100%;padding:15px 0;border-radius:12px;background:var(--ember);color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em;transition:.15s;}
.btn-primary:active{background:var(--ember-dark);}
.login-hint{text-align:center;font-size:11.5px;color:#8a7a68;margin-top:16px;line-height:1.5;}
.login-error{background:rgba(192,57,43,0.18);color:#f3b9b1;font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--charcoal-900);color:var(--cream);padding:16px 18px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
.topbar-brand-row{display:flex;align-items:center;gap:9px;}
.topbar-logo{width:32px;height:32px;object-fit:contain;border-radius:8px;flex-shrink:0;}
.topbar-brand{display:flex;flex-direction:column;line-height:1.1;}
.topbar-brand b{font-family:var(--font-display);font-size:16.5px;letter-spacing:.01em;}
.topbar-brand span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;color:var(--flame);margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.badge-branch{font-size:11.5px;font-weight:600;background:var(--charcoal-700);color:var(--cream-dim);padding:6px 10px;border-radius:999px;}
.logout-btn{color:#b6a897;font-size:19px;padding:4px;}
.content{flex:1;padding:18px 16px 90px;overflow-y:auto;}
.bottomnav{position:sticky;bottom:0;display:flex;background:var(--charcoal-900);border-top:1px solid rgba(255,255,255,0.08);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:#8a7a68;font-size:10.5px;font-weight:600;letter-spacing:.01em;border-radius:10px;}
.nav-btn .nav-ic{font-size:19px;}
.nav-btn.active{color:var(--flame);}

/* ---------- section header ---------- */
.section-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--charcoal-900);margin:0 0 4px;}
.section-desc{font-size:13px;color:#7a6c5c;margin:0 0 18px;}

/* ---------- banner ---------- */
.banner{padding:12px 14px;border-radius:11px;font-size:13.5px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.banner.success{background:var(--green-light);color:var(--green);}
.banner.info{background:var(--blue-light);color:var(--blue);}

/* ---------- home cards / stats ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.stat-card{background:var(--charcoal-900);color:var(--cream);border-radius:14px;padding:14px;}
.stat-num{font-family:var(--font-display);font-size:26px;font-weight:700;}
.stat-label{font-size:11px;color:#b6a897;margin-top:2px;letter-spacing:.02em;}
.stat-card.ember{background:linear-gradient(135deg,var(--ember),var(--ember-dark));}
.action-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;transition:.15s;}
.action-card:active{transform:scale(0.98);}
.action-ic{font-size:22px;width:38px;height:38px;border-radius:10px;background:var(--cream-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.action-text b{display:block;font-size:14.5px;font-weight:700;}
.action-text span{font-size:12px;color:#8a7c6c;}

/* ---------- ticket card (request) ---------- */
.ticket{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;}
.ticket-head{padding:14px 15px 12px;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;}
.ticket-id{font-family:var(--font-mono);font-size:11px;color:#9c8f80;}
.ticket-branch{font-family:var(--font-display);font-weight:700;font-size:15.5px;margin-top:2px;}
.ticket-date{font-size:12px;color:#8a7c6c;margin-top:1px;}
.ticket-dash{border-top:1.5px dashed var(--line);margin:0 15px;}
.ticket-body{padding:14px 15px 16px;}
.item-line{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
.item-line .l{color:#5c5148;}
.item-line .v{font-family:var(--font-mono);font-weight:600;}
.subhead{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a89880;margin:12px 0 4px;}
.subhead:first-child{margin-top:0;}

/* ---------- ember tracker (signature element) ---------- */
.tracker{display:flex;align-items:flex-start;padding:14px 4px 4px;}
.tnode{display:flex;flex-direction:column;align-items:center;width:52px;flex-shrink:0;}
.tdot{width:22px;height:22px;border-radius:50%;background:var(--charcoal-600);display:flex;align-items:center;justify-content:center;font-size:11px;transition:.2s;}
.tnode.lit .tdot{background:var(--ember);box-shadow:0 0 0 4px var(--ember-light);}
.tnode.current .tdot{animation:flicker 1.4s infinite ease-in-out;}
.tlabel{font-size:9px;color:#a89880;margin-top:5px;text-align:center;line-height:1.2;font-weight:600;}
.tnode.lit .tlabel{color:var(--ember-dark);}
.tline{flex:1;height:2px;background:var(--charcoal-600);margin-top:11px;}
.tline.lit{background:var(--ember);}
.tracker.rejected{padding:6px 4px;}
.reject-badge{font-size:12.5px;font-weight:700;color:var(--red);background:var(--red-light);padding:5px 10px;border-radius:8px;}

/* ---------- wizard ---------- */
.progress-track{height:5px;background:var(--cream-dim);border-radius:999px;overflow:hidden;margin-bottom:6px;}
.progress-fill{height:100%;background:var(--ember);border-radius:999px;transition:width .2s;}
.progress-label{font-family:var(--font-mono);font-size:11px;color:#9c8f80;margin-bottom:20px;}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);}
.item-label{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;}
.item-emoji{font-size:18px;}
.item-input-wrap{display:flex;align-items:center;gap:7px;}
.item-input{width:74px;padding:9px 10px;border-radius:9px;border:1.5px solid var(--line);text-align:right;font-family:var(--font-mono);font-weight:600;font-size:14px;background:#fff;}
.item-input:focus{outline:none;border-color:var(--ember);}
.item-unit{font-size:11.5px;color:#9c8f80;width:44px;}
.other-row{display:grid;grid-template-columns:1fr 62px 66px 30px;gap:6px;margin-bottom:9px;align-items:center;}
.other-input{padding:9px 9px;border-radius:9px;border:1.5px solid var(--line);font-size:13px;background:#fff;}
.other-input:focus{outline:none;border-color:var(--ember);}
.other-input.qty{text-align:right;font-family:var(--font-mono);}
.icon-btn.remove{width:28px;height:28px;border-radius:8px;background:var(--red-light);color:var(--red);font-size:13px;font-weight:700;}
.add-item-btn{width:100%;padding:12px 0;border:1.5px dashed var(--line);border-radius:11px;color:var(--ember-dark);font-weight:700;font-size:13.5px;margin-top:2px;}
.wizard-nav{display:flex;gap:10px;margin-top:22px;}
.btn-secondary{flex:1;padding:14px 0;border-radius:12px;background:var(--cream-dim);color:var(--charcoal-900);font-weight:700;font-size:14.5px;}
.wizard-nav .btn-primary{flex:1.4;}
.cancel-link{display:block;text-align:center;font-size:12.5px;color:#a89880;margin-top:16px;font-weight:600;}
.back-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--ember-dark);margin-bottom:14px;}

/* ---------- admin action panels ---------- */
.action-panel{background:var(--cream-dim);border-radius:12px;padding:14px;margin-top:12px;}
.action-panel .subhead{color:#8a7c6c;}
.panel-row{display:flex;gap:8px;margin-top:10px;}
.panel-row .btn-primary,.panel-row .btn-secondary{padding:12px 0;font-size:13.5px;}
textarea.other-input{width:100%;min-height:60px;resize:vertical;font-size:13.5px;}
.btn-row-3{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.btn-small{padding:10px 14px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--charcoal-900);color:#fff;}
.btn-small.approve{background:var(--green);}
.btn-small.reject{background:var(--red);}
.btn-small.dispatch{background:var(--ember);}
.btn-small.ghost{background:var(--cream-dim);color:var(--charcoal-900);}
.btn-small.receive{background:var(--green);width:100%;padding:14px 0;font-size:14px;}

/* ---------- filters ---------- */
.filter-row{display:flex;gap:8px;margin-bottom:16px;}
.filter-select{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;background:#fff;}

/* ---------- empty state ---------- */
.empty-state{text-align:center;padding:50px 20px;color:#a89880;}
.empty-state .ic{font-size:32px;margin-bottom:10px;}
.empty-state b{display:block;font-size:14.5px;color:#5c5148;margin-bottom:4px;}
.empty-state span{font-size:12.5px;}
</style>
</head>
<body>
<div id="app-outer"><div id="app"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   EL SABROSO — BRANCH INVENTORY & STOCK REQUEST (mobile web app)
   Data is stored via window.storage (shared) instead of Firebase.
   Shared storage means anyone using this app's link/file sees the
   same requests — that's what makes branch <-> admin sync work.
   ============================================================ */

const STANDARD_ITEMS = [
  {key:'manok', label:'Manok', emoji:'🐔', unit:'pcs'},
  {key:'uling', label:'Uling', emoji:'🔥', unit:'sacks'},
  {key:'foil', label:'Foil', emoji:'📦', unit:'boxes'},
  {key:'tiny', label:'Tiny', emoji:'📦', unit:'packs'},
  {key:'patok', label:'Patok', emoji:'📦', unit:'packs'},
  {key:'yellowPlastic', label:'Yellow Plastic w/ Logo', emoji:'🟡', unit:'packs'},
  {key:'sili', label:'Sili', emoji:'🌶️', unit:'kilos'},
  {key:'toyo', label:'Toyo', emoji:'🥫', unit:'bottles'}
];
const DEFAULT_BRANCHES = ['Abuyod','BN2','Boso-Boso','Pagrai','Pawpawan','Pinugay','Rizza','San Luis','San Jose','Sapa','Pantay'];
const BRANCH_PASSCODES = {
  'Abuyod':'4821', 'BN2':'7093', 'Boso-Boso':'3456', 'Pagrai':'9182', 'Pawpawan':'2604',
  'Pinugay':'6739', 'Rizza':'5017', 'San Luis':'8265', 'Sapa':'1948', 'Pantay':'3702',
  'San Jose':'0000' // not in the original passcode list — change this before using San Jose
};
const ADMIN_PASSCODE = 'ElSabroso2026!';
const PRODUCTION_PASSCODE = 'SauceProd2026!';

const INGREDIENTS = [
  {key:'camelSoy', label:'Camel Soy Sauce', emoji:'🍶', unit:'bottles'},
  {key:'pineapple', label:'Pineapple', emoji:'🍍', unit:'kg'},
  {key:'magicSarap', label:'Magic Sarap', emoji:'🧂', unit:'packs'},
  {key:'vetsin', label:'Vetsin', emoji:'🧂', unit:'packs'},
  {key:'knorrCube', label:'Knorr Cube', emoji:'🧊', unit:'pcs'},
  {key:'pepperLamas', label:'Pepper Lamas', emoji:'🌶️', unit:'kg'},
  {key:'atsal', label:'Atsal', emoji:'🌿', unit:'kg'},
  {key:'sebolyon', label:'Sebolyon', emoji:'🧅', unit:'kg'},
  {key:'ajos', label:'Ajos', emoji:'🧄', unit:'kg'},
  {key:'sugar', label:'Sugar', emoji:'🍚', unit:'kg'},
  {key:'asin', label:'Asin', emoji:'🧂', unit:'kg'}
];
// Low-stock thresholds — edit these numbers to match real usage. An item is
// "Low" at or below its threshold, and "Out" at zero or less.
const LOW_STOCK_THRESHOLDS = {
  camelSoy:5, pineapple:3, magicSarap:5, vetsin:5, knorrCube:10,
  pepperLamas:1, atsal:1, sebolyon:2, ajos:2, sugar:3, asin:3,
  rawChicken:50, sauce:10
};
const STATUS_STEPS = ['PENDING','APPROVED','OUT_FOR_DELIVERY','RECEIVED'];
const STATUS_TRACK_LABEL = {PENDING:'Sent',APPROVED:'Approved',OUT_FOR_DELIVERY:'On the way',RECEIVED:'Received'};
const STATUS_PILL = {PENDING:'pending',APPROVED:'approved',OUT_FOR_DELIVERY:'delivery',RECEIVED:'received',REJECTED:'rejected'};
const STATUS_TEXT = {PENDING:'Pending',APPROVED:'Approved',OUT_FOR_DELIVERY:'Out for delivery',RECEIVED:'Received',REJECTED:'Rejected'};

let state = {
  loaded:false,
  role:null,          // 'branch' | 'admin' | 'production' | 'staff'
  branch:null,
  requests:[],
  customBranches:[],
  customBranchPasscodes:{},  // branch name -> passcode, for "Other/New Branch" entries
  loginRoleTab:'branch',
  loginBranchSelect:DEFAULT_BRANCHES[0],
  loginBranchOther:'',
  loginBranchPasscode:'',
  loginAdminPass:'',
  loginProductionPass:'',
  loginStaffId:'',
  loginStaffPin:'',
  loginError:'',
  screen:'home',
  banner:null,
  step:1,
  draft:null,
  expandedId:null,
  adminActions:{},     // requestId -> {mode, ...temp fields}
  adminFilterBranch:'ALL',
  adminFilterStatus:'ALL',
  reportBranch:'ALL',
  reportFrom: new Date(Date.now()-29*86400000).toISOString().slice(0,10),
  reportTo: new Date().toISOString().slice(0,10),

  /* --- production module --- */
  ingredientStock: {},      // key -> qty
  sauceLiters: 0,
  rawChickenPcs: 0,
  injectedChickenPcs: 0,
  productionBatches: [],    // sauce + injection batches, combined log
  prodScreen:'dashboard',
  stockInDraft: null,       // {scope:'ingredient'|'rawChicken', key, qty}
  sauceDraft: null,
  injectionDraft: null,
  prodExpandedId:null,

  /* --- production staff + tasks --- */
  productionStaff: [],       // {id,name,pin,canMakeSauce,canDoInjection,active}
  productionTasks: [],       // production requests/tasks assigned to staff
  currentStaffId: null,
  staffScreen: 'tasks',
  staffTaskDrafts: {},       // taskId -> entry draft
  staffExpandedId: null,
  taskExpandedId: null,
  taskCreateType: null,      // 'SAUCE' | 'INJECTION' | null
  taskCreateDraft: null,
  staffCreateOpen: false,
  staffCreateDraft: null
};

/* ---------------- storage ----------------
   FIREBASE SETUP (optional — app works without it):
   1. Go to console.firebase.google.com → Create project → Build → Firestore Database → Create (start in test mode).
   2. Project settings → General → "Your apps" → Web app → copy the config object.
   3. Paste the 6 values into FIREBASE_CONFIG below. Nothing else needs to change —
      the app will automatically switch from built-in storage to Firebase and turn
      on live real-time sync across every device.
   4. Before going live, tighten your Firestore rules (test mode is wide open), e.g.:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /elSabroso/{docId} {
              allow read, write: if true; // replace with real auth checks later
            }
          }
        }
------------------------------------------------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBiuW1j5dwjVQ8UMC4NrD8nZv0yDboT5iU",
  authDomain: "elsabroso-inventory.firebaseapp.com",
  projectId: "elsabroso-inventory",
  storageBucket: "elsabroso-inventory.firebasestorage.app",
  messagingSenderId: "74761676449",
  appId: "1:74761676449:web:36427e37992a8b1c0ff2e0"
};
const USE_FIREBASE = !!FIREBASE_CONFIG.apiKey;
let fsDb = null;
if(USE_FIREBASE && window.firebase){
  firebase.initializeApp(FIREBASE_CONFIG);
  fsDb = firebase.firestore();
}

async function loadRequests(){
  if(USE_FIREBASE){
    try{ const doc = await fsDb.collection('elSabroso').doc('requests').get(); return doc.exists ? (doc.data().items||[]) : []; }
    catch(e){ console.error('Firestore error', e); return []; }
  }
  try{ const r = await window.storage.get('requests', true); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function saveRequests(){
  if(USE_FIREBASE){
    try{ await fsDb.collection('elSabroso').doc('requests').set({items: state.requests}); }
    catch(e){ console.error('Firestore error', e); }
    return;
  }
  try{ await window.storage.set('requests', JSON.stringify(state.requests), true); }
  catch(e){ console.error('Storage error', e); }
}
async function loadCustomBranches(){
  if(USE_FIREBASE){
    try{ const doc = await fsDb.collection('elSabroso').doc('branches').get(); return doc.exists ? {items: doc.data().items||[], passcodes: doc.data().passcodes||{}} : {items:[], passcodes:{}}; }
    catch(e){ console.error('Firestore error', e); return {items:[], passcodes:{}}; }
  }
  try{ const r = await window.storage.get('custom-branches', true); return r ? JSON.parse(r.value) : {items:[], passcodes:{}}; }
  catch(e){ return {items:[], passcodes:{}}; }
}
async function saveCustomBranches(){
  const payload = {items: state.customBranches, passcodes: state.customBranchPasscodes};
  if(USE_FIREBASE){
    try{ await fsDb.collection('elSabroso').doc('branches').set(payload); }
    catch(e){ console.error('Firestore error', e); }
    return;
  }
  try{ await window.storage.set('custom-branches', JSON.stringify(payload), true); }
  catch(e){ console.error('Storage error', e); }
}

async function loadProduction(){
  const empty = { ingredientStock:{}, sauceLiters:0, rawChickenPcs:0, injectedChickenPcs:0, productionBatches:[] };
  if(USE_FIREBASE){
    try{ const doc = await fsDb.collection('elSabroso').doc('production').get(); return doc.exists ? {...empty, ...doc.data()} : empty; }
    catch(e){ console.error('Firestore error', e); return empty; }
  }
  try{ const r = await window.storage.get('production', true); return r ? {...empty, ...JSON.parse(r.value)} : empty; }
  catch(e){ return empty; }
}
async function saveProduction(){
  const payload = {
    ingredientStock: state.ingredientStock,
    sauceLiters: state.sauceLiters,
    rawChickenPcs: state.rawChickenPcs,
    injectedChickenPcs: state.injectedChickenPcs,
    productionBatches: state.productionBatches
  };
  if(USE_FIREBASE){
    try{ await fsDb.collection('elSabroso').doc('production').set(payload); }
    catch(e){ console.error('Firestore error', e); }
    return;
  }
  try{ await window.storage.set('production', JSON.stringify(payload), true); }
  catch(e){ console.error('Storage error', e); }
}

function setupRealtimeSync(){
  if(!USE_FIREBASE) return;
  fsDb.collection('elSabroso').doc('requests').onSnapshot(doc=>{
    if(doc.exists){ state.requests = doc.data().items||[]; render(); }
  });
  fsDb.collection('elSabroso').doc('branches').onSnapshot(doc=>{
    if(doc.exists){ state.customBranches = doc.data().items||[]; state.customBranchPasscodes = doc.data().passcodes||{}; render(); }
  });
  fsDb.collection('elSabroso').doc('production').onSnapshot(doc=>{
    if(doc.exists){
      const d = doc.data();
      state.ingredientStock = d.ingredientStock||{};
      state.sauceLiters = d.sauceLiters||0;
      state.rawChickenPcs = d.rawChickenPcs||0;
      state.injectedChickenPcs = d.injectedChickenPcs||0;
      state.productionBatches = d.productionBatches||[];
      render();
    }
  });
  fsDb.collection('elSabroso').doc('staff').onSnapshot(doc=>{
    if(doc.exists){ state.productionStaff = doc.data().items||[]; render(); }
  });
  fsDb.collection('elSabroso').doc('tasks').onSnapshot(doc=>{
    if(doc.exists){ state.productionTasks = doc.data().items||[]; render(); }
  });
}

/* ---------------- helpers ---------------- */
function genId(prefix){ return prefix+'-'+Date.now().toString(36).toUpperCase().slice(-5)+Math.floor(Math.random()*90+10); }
function todayISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return ''; return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function blankQtyMap(){ const o={}; STANDARD_ITEMS.forEach(i=>o[i.key]=0); return o; }
function allBranches(){ return [...DEFAULT_BRANCHES, ...state.customBranches]; }
function isToday(iso){ if(!iso) return false; const d=new Date(iso), n=new Date(); return d.toDateString()===n.toDateString(); }
function getStockAlerts(){
  const alerts = [];
  INGREDIENTS.forEach(i=>{
    const qty = state.ingredientStock[i.key]||0;
    const threshold = LOW_STOCK_THRESHOLDS[i.key]||0;
    if(qty<=0) alerts.push({label:i.label, emoji:i.emoji, qty, unit:i.unit, status:'out'});
    else if(qty<=threshold) alerts.push({label:i.label, emoji:i.emoji, qty, unit:i.unit, status:'low'});
  });
  if(state.rawChickenPcs<=0) alerts.push({label:'Raw Chicken', emoji:'🐔', qty:state.rawChickenPcs, unit:'pcs', status:'out'});
  else if(state.rawChickenPcs<=LOW_STOCK_THRESHOLDS.rawChicken) alerts.push({label:'Raw Chicken', emoji:'🐔', qty:state.rawChickenPcs, unit:'pcs', status:'low'});
  if(state.sauceLiters<=0) alerts.push({label:'Injected Sauce', emoji:'🥣', qty:state.sauceLiters, unit:'liters', status:'out'});
  else if(state.sauceLiters<=LOW_STOCK_THRESHOLDS.sauce) alerts.push({label:'Injected Sauce', emoji:'🥣', qty:state.sauceLiters, unit:'liters', status:'low'});
  // Out items first, then low, each alphabetical
  return alerts.sort((a,b)=> (a.status===b.status? a.label.localeCompare(b.label) : a.status==='out'?-1:1));
}
function renderStockAlertCard(alerts, opts){
  opts = opts || {};
  if(!alerts.length) return '';
  const outCount = alerts.filter(a=>a.status==='out').length;
  const lowCount = alerts.filter(a=>a.status==='low').length;
  return `<div class="ticket" style="border-color:var(--red);margin-bottom:16px;">
    <div class="ticket-body">
      <div class="subhead" style="color:var(--red);">⚠️ Stock Alerts — ${outCount?`${outCount} out`:''}${outCount&&lowCount?', ':''}${lowCount?`${lowCount} low`:''}</div>
      ${alerts.map(a=>`<div class="item-line"><span class="l">${a.emoji} ${esc(a.label)}</span><span class="v" style="color:${a.status==='out'?'var(--red)':'var(--amber)'};">${a.status==='out'?'OUT OF STOCK':`Low — ${a.qty} ${a.unit} left`}</span></div>`).join('')}
      ${opts.navAction?`<button class="btn-small ghost" style="margin-top:10px;" data-action="${opts.navAction}" data-screen="${opts.navScreen}">View Ingredient Inventory</button>`:''}
    </div>
  </div>`;
}

/* ---------------- shell (post-login) ---------------- */
function renderShell(){
  return `<div class="shell">
    ${renderTopbar()}
    <div class="content">
      ${state.banner? renderBanner() : ''}
      ${state.role==='branch' ? renderBranchScreen() : state.role==='production' ? renderProductionScreen() : state.role==='staff' ? renderStaffScreen() : renderAdminScreen()}
    </div>
    ${renderBottomNav()}
  </div>`;
}

function renderBanner(){
  return `<div class="banner ${state.banner.type}">${state.banner.icon||'✅'} ${esc(state.banner.text)}</div>`;
}

function renderBottomNav(){
  if(state.role==='branch'){
    const items = [
      {k:'home',ic:'🏠',label:'Home'},
      {k:'newRequest',ic:'➕',label:'Request'},
      {k:'delivery',ic:'🚚',label:'Delivery'},
      {k:'history',ic:'📜',label:'History'}
    ];
    return `<div class="bottomnav">${items.map(i=>`
      <button class="nav-btn ${state.screen===i.k?'active':''}" data-action="nav" data-screen="${i.k}">
        <span class="nav-ic">${i.ic}</span>${i.label}
      </button>`).join('')}</div>`;
  }
  if(state.role==='production'){
    const items = [
      {k:'dashboard',ic:'🏠',label:'Dashboard'},
      {k:'ingredients',ic:'🧂',label:'Ingredients'},
      {k:'sauce',ic:'🥣',label:'Make Sauce'},
      {k:'injection',ic:'🐔',label:'Injection'},
      {k:'prodHistory',ic:'📜',label:'History'}
    ];
    return `<div class="bottomnav">${items.map(i=>`
      <button class="nav-btn ${state.prodScreen===i.k?'active':''}" data-action="prod-nav" data-screen="${i.k}">
        <span class="nav-ic">${i.ic}</span>${i.label}
      </button>`).join('')}</div>`;
  }
  if(state.role==='staff'){
    const items = [
      {k:'tasks',ic:'📝',label:'Tasks'},
      {k:'myHistory',ic:'📜',label:'History'}
    ];
    return `<div class="bottomnav">${items.map(i=>`
      <button class="nav-btn ${state.staffScreen===i.k?'active':''}" data-action="staff-nav" data-screen="${i.k}">
        <span class="nav-ic">${i.ic}</span>${i.label}
      </button>`).join('')}</div>`;
  }
  const items = [
    {k:'dashboard',ic:'🏠',label:'Dashboard'},
    {k:'requests',ic:'📝',label:'Requests'},
    {k:'allHistory',ic:'📜',label:'History'},
    {k:'reports',ic:'📊',label:'Reports'}
  ];
  return `<div class="bottomnav">${items.map(i=>`
    <button class="nav-btn ${state.screen===i.k?'active':''}" data-action="nav" data-screen="${i.k}">
      <span class="nav-ic">${i.ic}</span>${i.label}
    </button>`).join('')}</div>`;
}

/* ================= BRANCH SIDE ================= */
function renderBranchScreen(){
  if(state.screen==='home') return renderBranchHome();
  if(state.screen==='newRequest') return renderWizard();
  if(state.screen==='delivery') return renderBranchDelivery();
  if(state.screen==='history') return renderBranchHistory();
  return '';
}

function myRequests(){ return state.requests.filter(r=>r.branch===state.branch).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); }

function renderBranchHome(){
  const mine = myRequests();
  const pending = mine.filter(r=>r.status==='PENDING').length;
  const onWay = mine.filter(r=>r.status==='OUT_FOR_DELIVERY').length;
  const last = mine[0];
  return `
    <h2 class="section-title">Kumusta, ${esc(state.branch)}!</h2>
    <p class="section-desc">Here's what's happening with your stock right now.</p>
    <div class="stat-grid">
      <div class="stat-card ember"><div class="stat-num">${pending}</div><div class="stat-label">Pending requests</div></div>
      <div class="stat-card"><div class="stat-num">${onWay}</div><div class="stat-label">On the way</div></div>
    </div>
    <button class="action-card" data-action="nav" data-screen="newRequest" style="width:100%;text-align:left;border:1.5px solid var(--ember);">
      <div class="action-ic">➕</div>
      <div class="action-text"><b>New Stock Request</b><span>Balance stock → request → submit</span></div>
    </button>
    <button class="action-card" data-action="nav" data-screen="delivery" style="width:100%;text-align:left;">
      <div class="action-ic">🚚</div>
      <div class="action-text"><b>What's on Delivery</b><span>${onWay?`${onWay} delivery in transit`:'Nothing in transit right now'}</span></div>
    </button>
    <button class="action-card" data-action="nav" data-screen="history" style="width:100%;text-align:left;">
      <div class="action-ic">📜</div>
      <div class="action-text"><b>Request History</b><span>${last?`Last request ${fmtDate(last.createdAt)}`:'No requests yet'}</span></div>
    </button>
  `;
}

/* ---- wizard ---- */
function renderWizard(){
  if(!state.draft) state.draft = newDraft();
  const step = state.step;
  const pct = (step/4)*100;
  let body = '';
  if(step===1) body = renderWizardStep1();
  if(step===2) body = renderWizardStep2();
  if(step===3) body = renderWizardStep3();
  if(step===4) body = renderWizardStep4();
  return `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">STEP ${step} OF 4</div>
    ${body}
    <div class="wizard-nav">
      ${step>1?`<button class="btn-secondary" data-action="wizard-back">Back</button>`:''}
      ${step<4?`<button class="btn-primary" data-action="wizard-next">Next</button>`:`<button class="btn-primary" data-action="submit-request">Submit Request</button>`}
    </div>
    <button class="cancel-link" data-action="wizard-cancel">Cancel and discard</button>
  `;
}
function renderWizardStep1(){
  return `<h2 class="section-title">Balance Stock</h2>
  <p class="section-desc">Enter what's currently left in your branch.</p>
  <div>${STANDARD_ITEMS.map(item=>renderItemInput(item,'balance',state.draft.balance)).join('')}</div>`;
}
function renderWizardStep2(){
  return `<h2 class="section-title">Request Stock</h2>
  <p class="section-desc">Enter how much you'd like to request.</p>
  <div>${STANDARD_ITEMS.map(item=>renderItemInput(item,'requested',state.draft.requested)).join('')}</div>`;
}
function renderWizardStep3(){
  return `<h2 class="section-title">Other / Specify</h2>
  <p class="section-desc">Need something not on the standard list? Add it here.</p>
  ${state.draft.otherItems.length? state.draft.otherItems.map(renderOtherItemRow).join('') : `<div class="empty-state" style="padding:24px 10px;"><div class="ic">📦</div><span>No extra items added yet.</span></div>`}
  <button class="add-item-btn" data-action="add-other-item">+ Add Another Item</button>`;
}
function renderWizardStep4(){
  const d = state.draft;
  return `<h2 class="section-title">Summary</h2>
  <p class="section-desc">Review before submitting.</p>
  <div class="ticket">
    <div class="ticket-head" style="cursor:default;">
      <div><div class="ticket-id">${esc(state.branch.toUpperCase())}</div><div class="ticket-branch">Stock Request Summary</div><div class="ticket-date">${fmtDate(todayISO())}</div></div>
    </div>
    <div class="ticket-dash"></div>
    <div class="ticket-body">
      <div class="subhead">Balance Stock</div>
      ${STANDARD_ITEMS.map(i=>`<div class="item-line"><span class="l">${i.emoji} ${i.label}</span><span class="v">${d.balance[i.key]} ${i.unit}</span></div>`).join('')}
      <div class="subhead">Request Stock</div>
      ${STANDARD_ITEMS.map(i=>`<div class="item-line"><span class="l">${i.emoji} ${i.label}</span><span class="v">${d.requested[i.key]} ${i.unit}</span></div>`).join('')}
      ${d.otherItems.length?`<div class="subhead">Other Requested Items</div>${d.otherItems.map(o=>`<div class="item-line"><span class="l">➕ ${esc(o.name||'(unnamed)')}</span><span class="v">${o.qty||0} ${esc(o.unit||'')}</span></div>`).join('')}`:''}
    </div>
  </div>`;
}
function renderItemInput(item, scope, values){
  const val = values[item.key] ?? 0;
  return `<div class="item-row">
    <div class="item-label"><span class="item-emoji">${item.emoji}</span><span>${item.label}</span></div>
    <div class="item-input-wrap">
      <input type="number" min="0" step="0.5" inputmode="decimal" class="item-input" data-field="qty" data-scope="${scope}" data-key="${item.key}" value="${val}">
      <span class="item-unit">${item.unit}</span>
    </div>
  </div>`;
}
function renderOtherItemRow(row){
  return `<div class="other-row">
    <input type="text" placeholder="Item name" class="other-input" data-field="other-name" data-id="${row.id}" value="${esc(row.name)}">
    <input type="number" min="0" step="1" placeholder="Qty" class="other-input qty" data-field="other-qty" data-id="${row.id}" value="${row.qty||0}">
    <input type="text" placeholder="Unit" class="other-input" data-field="other-unit" data-id="${row.id}" value="${esc(row.unit)}">
    <button class="icon-btn remove" data-action="remove-other-item" data-id="${row.id}">✕</button>
  </div>`;
}

/* ---- delivery ---- */
function renderBranchDelivery(){
  const onWay = myRequests().filter(r=>r.status==='OUT_FOR_DELIVERY');
  if(!onWay.length) return `<h2 class="section-title">What's on Delivery</h2><div class="empty-state"><div class="ic">🚚</div><b>Nothing in transit</b><span>Approved requests being delivered will show up here.</span></div>`;
  return `<h2 class="section-title">What's on Delivery</h2>
  ${onWay.map(r=>`
    <div class="ticket">
      <div class="ticket-head" style="cursor:default;">
        <div><div class="ticket-id">${esc(r.delivery?.deliveryNo||r.id)}</div><div class="ticket-branch">🚛 Out for Delivery</div><div class="ticket-date">${fmtDate(r.delivery?.date||r.createdAt)}</div></div>
        <span class="pill delivery">${STATUS_TEXT[r.status]}</span>
      </div>
      <div class="ticket-dash"></div>
      <div class="ticket-body">
        ${STANDARD_ITEMS.filter(i=>(r.approved?.[i.key]||0)>0).map(i=>`<div class="item-line"><span class="l">${i.emoji} ${i.label}</span><span class="v">${r.approved[i.key]} ${i.unit}</span></div>`).join('')}
        ${(r.otherItems||[]).filter(o=>(o.approvedQty||0)>0).map(o=>`<div class="item-line"><span class="l">➕ ${esc(o.name)}</span><span class="v">${o.approvedQty} ${esc(o.unit||'')}</span></div>`).join('')}
        <div class="subhead">Driver</div>
        <div class="item-line"><span class="l">${esc(r.delivery?.driver||'—')}</span><span class="v">${esc(r.delivery?.vehicle||'')}</span></div>
        <button class="btn-small receive" style="margin-top:14px;" data-action="branch-mark-received" data-id="${r.id}">📍 Mark as Received</button>
      </div>
    </div>
  `).join('')}`;
}

/* ---- history ---- */
function renderBranchHistory(){
  const mine = myRequests();
  if(!mine.length) return `<h2 class="section-title">Request History</h2><div class="empty-state"><div class="ic">📜</div><b>No requests yet</b><span>Your submitted requests will appear here.</span></div>`;
  return `<h2 class="section-title">Request History</h2>${mine.map(renderRequestTicket).join('')}`;
}

function renderRequestTicket(r){
  const expanded = state.expandedId===r.id;
  return `<div class="ticket">
    <div class="ticket-head" data-action="toggle-expand" data-id="${r.id}">
      <div><div class="ticket-id">${esc(r.id)}</div><div class="ticket-branch">${esc(r.branch)}</div><div class="ticket-date">${fmtDate(r.createdAt)}</div></div>
      <span class="pill ${STATUS_PILL[r.status]}">${STATUS_TEXT[r.status]}</span>
    </div>
    ${renderTracker(r.status)}
    ${expanded?`
    <div class="ticket-dash"></div>
    <div class="ticket-body">
      <div class="subhead">Balance Stock (reported)</div>
      ${STANDARD_ITEMS.map(i=>`<div class="item-line"><span class="l">${i.emoji} ${i.label}</span><span class="v">${r.balance[i.key]} ${i.unit}</span></div>`).join('')}
      <div class="subhead">Requested</div>
      ${STANDARD_ITEMS.map(i=>`<div class="item-line"><span class="l">${i.emoji} ${i.label}</span><span class="v">${r.requested[i.key]} ${i.unit}</span></div>`).join('')}
      ${r.approved?`<div class="subhead">Approved</div>${STANDARD_ITEMS.map(i=>`<div class="item-line"><span class="l">${i.emoji} ${i.label}</span><span class="v">${r.approved[i.key]??'—'} ${i.unit}</span></div>`).join('')}`:''}
      ${(r.otherItems||[]).length?`<div class="subhead">Other Items</div>${r.otherItems.map(o=>`<div class="item-line"><span class="l">➕ ${esc(o.name)}</span><span class="v">${o.qty} ${esc(o.unit||'')}${o.approvedQty!=null?` → ${o.approvedQty} appvd`:''}</span></div>`).join('')}`:''}
      ${r.status==='REJECTED' && r.rejectReason?`<div class="subhead">Reject Reason</div><div class="item-line"><span class="l">${esc(r.rejectReason)}</span></div>`:''}
    </div>`:''}
  </div>`;
}

function renderTracker(status){
  if(status==='REJECTED'){
    return `<div class="tracker rejected"><span class="reject-badge">✕ Rejected</span></div>`;
  }
  const idx = STATUS_STEPS.indexOf(status);
  return `<div class="tracker">${STATUS_STEPS.map((s,i)=>`
    <div class="tnode ${i<=idx?'lit':''} ${i===idx?'current':''}">
      <div class="tdot">${i<=idx?'🔥':''}</div>
      <div class="tlabel">${STATUS_TRACK_LABEL[s]}</div>
    </div>${i<STATUS_STEPS.length-1?`<div class="tline ${i<idx?'lit':''}"></div>`:''}`).join('')}</div>`;
}

function renderAdminScreen(){
  if(state.screen==='dashboard') return renderAdminDashboard();
  if(state.screen==='requests') return renderAdminRequests();
  if(state.screen==='allHistory') return renderAdminHistory();
  if(state.screen==='reports') return renderAdminReports();
  if(state.screen==='prodTasks') return renderTasksManagement();
  if(state.screen==='staffManage') return renderStaffManagement();
  return '';
}

function renderAdminReports(){
  const branches = ['ALL', ...allBranches()];
  const from = new Date(state.reportFrom+'T00:00:00');
  const to = new Date(state.reportTo+'T23:59:59');
  let rs = state.requests.filter(r=>{
    const d = new Date(r.createdAt);
    return d>=from && d<=to;
  });
  if(state.reportBranch!=='ALL') rs = rs.filter(r=>r.branch===state.reportBranch);

  const total = rs.length;
  const received = rs.filter(r=>r.status==='RECEIVED').length;
  const pending = rs.filter(r=>r.status==='PENDING').length;
  const rejected = rs.filter(r=>r.status==='REJECTED').length;

  const itemTotals = STANDARD_ITEMS.map(i=>{
    let reqSum=0, apprSum=0, delSum=0;
    rs.forEach(r=>{
      reqSum += r.requested[i.key]||0;
      if(r.approved) apprSum += r.approved[i.key]||0;
      if(r.status==='RECEIVED') delSum += (r.approved?r.approved[i.key]:0)||0;
    });
    return {...i, reqSum, apprSum, delSum};
  });

  const byBranch = {};
  rs.forEach(r=>{
    if(!byBranch[r.branch]) byBranch[r.branch] = {total:0, received:0};
    byBranch[r.branch].total++;
    if(r.status==='RECEIVED') byBranch[r.branch].received++;
  });
  const branchRows = Object.keys(byBranch).sort();

  return `<h2 class="section-title">Reports</h2>
  <p class="section-desc">Totals across requests in the selected range.</p>
  <div class="filter-row">
    <input type="date" class="filter-select" data-field="report-from" value="${state.reportFrom}">
    <input type="date" class="filter-select" data-field="report-to" value="${state.reportTo}">
  </div>
  <div class="filter-row">
    <select class="filter-select" data-field="report-branch">${branches.map(b=>`<option value="${esc(b)}" ${state.reportBranch===b?'selected':''}>${b==='ALL'?'All Branches':esc(b)}</option>`).join('')}</select>
  </div>
  <div class="stat-grid">
    <div class="stat-card ember"><div class="stat-num">${total}</div><div class="stat-label">Total requests</div></div>
    <div class="stat-card"><div class="stat-num">${received}</div><div class="stat-label">Received</div></div>
    <div class="stat-card"><div class="stat-num">${pending}</div><div class="stat-label">Still pending</div></div>
    <div class="stat-card"><div class="stat-num">${rejected}</div><div class="stat-label">Rejected</div></div>
  </div>
  <div class="ticket">
    <div class="ticket-body">
      <div class="subhead">Item Totals — Requested / Approved / Delivered</div>
      ${itemTotals.map(i=>`<div class="item-line"><span class="l">${i.emoji} ${i.label}</span><span class="v">${i.reqSum} / ${i.apprSum} / ${i.delSum} ${i.unit}</span></div>`).join('')}
    </div>
  </div>
  ${branchRows.length?`<div class="ticket"><div class="ticket-body">
    <div class="subhead">By Branch — Requests / Received</div>
    ${branchRows.map(b=>`<div class="item-line"><span class="l">${esc(b)}</span><span class="v">${byBranch[b].total} / ${byBranch[b].received}</span></div>`).join('')}
  </div></div>`:`<div class="empty-state"><div class="ic">📊</div><b>No requests in range</b><span>Try widening the date range.</span></div>`}`;
}

function renderAdminDashboard(){
  const rs = state.requests;

  const approved = rs.filter(r=>r.status==='APPROVED').length;

  return `
    <h2 class="section-title">Admin Dashboard</h2>

    ${renderStockAlertCard(getStockAlerts())}

      <div class="stat-card"><div class="stat-num">${approved}</div><div class="stat-label">Ready for delivery</div></div>
      <div class="stat-card"><div class="stat-num">${onWay}</div><div class="stat-label">Out for delivery</div></div>
      <div class="stat-card"><div class="stat-num">${receivedToday}</div><div class="stat-label">Received today</div></div>

    <div class="subhead" style="margin-top:20px;margin-bottom:8px;">Team &amp; Production</div>
    <button class="action-card" data-action="nav" data-screen="prodTasks" style="width:100%;text-align:left;">

function renderAdminRequests(){
  const rs = state.requests.filter(r=>r.status!=='RECEIVED' && r.status!=='REJECTED').sort((a,b)=>{
    const order = {PENDING:0,APPROVED:1,OUT_FOR_DELIVERY:2};
    return order[a.status]-order[b.status] || new Date(b.createdAt)-new Date(a.createdAt);
  });
  return `<h2 class="section-title">Stock Requests</h2>
  <p class="section-desc">Approve, reject, or dispatch branch requests.</p>
  ${rs.length? rs.map(renderAdminTicket).join('') : `<div class="empty-state"><div class="ic">📝</div><b>Nothing active</b><span>All requests are received or rejected.</span></div>`}`;
}

function renderAdminHistory(){
  const branches = ['ALL', ...allBranches()];
  const statuses = ['ALL','PENDING','APPROVED','OUT_FOR_DELIVERY','RECEIVED','REJECTED'];
  let rs = state.requests.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(state.adminFilterBranch!=='ALL') rs = rs.filter(r=>r.branch===state.adminFilterBranch);
  if(state.adminFilterStatus!=='ALL') rs = rs.filter(r=>r.status===state.adminFilterStatus);
  return `<h2 class="section-title">All Requests</h2>
  <div class="filter-row">
    <select class="filter-select" data-field="filter-branch">${branches.map(b=>`<option value="${esc(b)}" ${state.adminFilterBranch===b?'selected':''}>${b==='ALL'?'All Branches':esc(b)}</option>`).join('')}</select>
    <select class="filter-select" data-field="filter-status">${statuses.map(s=>`<option value="${s}" ${state.adminFilterStatus===s?'selected':''}>${s==='ALL'?'All Statuses':STATUS_TEXT[s]}</option>`).join('')}</select>
  </div>
  ${rs.length? rs.map(renderRequestTicket).join('') : `<div class="empty-state"><div class="ic">📭</div><b>No matching requests</b><span>Try a different filter.</span></div>`}`;
}

function renderAdminTicket(r){
  const expanded = state.expandedId===r.id;
  const act = state.adminActions[r.id];
  return `<div class="ticket">
    <div class="ticket-head" data-action="toggle-expand" data-id="${r.id}">
      <div><div class="ticket-id">${esc(r.id)}</div><div class="ticket-branch">${esc(r.branch)}</div><div class="ticket-date">${fmtDate(r.createdAt)}</div></div>
      <span class="pill ${STATUS_PILL[r.status]}">${STATUS_TEXT[r.status]}</span>
    </div>
    ${renderTracker(r.status)}
    ${expanded?`
    <div class="ticket-dash"></div>
    <div class="ticket-body">
      <div class="subhead">Balance Stock (reported)</div>
      ${STANDARD_ITEMS.map(i=>`<div class="item-line"><span class="l">${i.emoji} ${i.label}</span><span class="v">${r.balance[i.key]} ${i.unit}</span></div>`).join('')}
      <div class="subhead">Requested</div>

      ${(r.otherItems||[]).length?`<div class="subhead">Other Requested</div>${r.otherItems.map(o=>`<div class="item-line"><span class="l">➕ ${esc(o.name)}</span><span class="v">${o.qty} ${esc(o.unit||'')}</span></div>`).join('')}`:''}

      ${renderAdminActionArea(r, act)}

}

function renderAdminActionArea(r, act){
  if(r.status==='PENDING'){
    if(!act) return `<div class="btn-row-3">
      <button class="btn-small approve" data-action="admin-start-approve" data-id="${r.id}">✔ Review & Approve</button>
      <button class="btn-small reject" data-action="admin-start-reject" data-id="${r.id}">✕ Reject</button>
    </div>`;
    if(act.mode==='approve'){
      return `<div class="action-panel">
        <div class="subhead">Set Approved Quantities</div>
        ${STANDARD_ITEMS.map(i=>`<div class="item-row"><div class="item-label"><span class="item-emoji">${i.emoji}</span><span>${i.label}</span></div>
          <div class="item-input-wrap"><input type="number" min="0" step="0.5" class="item-input" data-field="admin-approve-qty" data-id="${r.id}" data-key="${i.key}" value="${act.approvedQtys[i.key]}"><span class="item-unit">${i.unit}</span></div></div>`).join('')}
        ${(r.otherItems||[]).map(o=>`<div class="item-row"><div class="item-label"><span>➕ ${esc(o.name)}</span></div>
          <div class="item-input-wrap"><input type="number" min="0" step="1" class="item-input" data-field="admin-approve-other" data-id="${r.id}" data-other-id="${o.id}" value="${act.approvedOther[o.id]}"><span class="item-unit">${esc(o.unit||'')}</span></div></div>`).join('')}
        <div class="panel-row">
          <button class="btn-primary" data-action="admin-confirm-approve" data-id="${r.id}">Confirm Approval</button>
          <button class="btn-secondary" data-action="admin-cancel-action" data-id="${r.id}">Cancel</button>
        </div>
      </div>`;
    }
    if(act.mode==='reject'){
      return `<div class="action-panel">
        <div class="subhead">Reason for Rejecting</div>
        <textarea class="other-input" data-field="admin-reject-reason" data-id="${r.id}" placeholder="e.g. Please re-check balance stock count">${esc(act.rejectReason)}</textarea>
        <div class="panel-row">
          <button class="btn-primary" style="background:var(--red);" data-action="admin-confirm-reject" data-id="${r.id}">Confirm Reject</button>
          <button class="btn-secondary" data-action="admin-cancel-action" data-id="${r.id}">Cancel</button>
        </div>
      </div>`;
    }
  }
  if(r.status==='APPROVED'){
    if(!act || act.mode!=='dispatch') return `<div class="subhead">Approved</div>
      ${STANDARD_ITEMS.map(i=>`<div class="item-line"><span class="l">${i.emoji} ${i.label}</span><span class="v">${r.approved[i.key]} ${i.unit}</span></div>`).join('')}
      <div class="btn-row-3"><button class="btn-small dispatch" data-action="admin-start-dispatch" data-id="${r.id}">🚚 Prepare & Dispatch</button></div>`;
    return `<div class="action-panel">
      <div class="subhead">Delivery Details</div>
      <label class="field-label">Delivery No.</label>
      <input class="other-input" style="width:100%;margin-bottom:8px;" data-field="admin-dispatch-no" data-id="${r.id}" value="${esc(act.deliveryNo)}">
      <label class="field-label">Delivery Date</label>
      <input type="date" class="other-input" style="width:100%;margin-bottom:8px;" data-field="admin-dispatch-date" data-id="${r.id}" value="${esc(act.date)}">
      <label class="field-label">Driver</label>
      <input class="other-input" style="width:100%;margin-bottom:8px;" data-field="admin-dispatch-driver" data-id="${r.id}" value="${esc(act.driver)}" placeholder="Driver name">
      <label class="field-label">Vehicle</label>
      <input class="other-input" style="width:100%;margin-bottom:8px;" data-field="admin-dispatch-vehicle" data-id="${r.id}" value="${esc(act.vehicle)}" placeholder="Plate no.">
      <div class="panel-row">
        <button class="btn-primary" data-action="admin-confirm-dispatch" data-id="${r.id}">Send Out for Delivery</button>
        <button class="btn-secondary" data-action="admin-cancel-action" data-id="${r.id}">Cancel</button>
      </div>
    </div>`;
  }
  if(r.status==='OUT_FOR_DELIVERY'){
    return `<div class="subhead">Delivery</div>
    <div class="item-line"><span class="l">Delivery No.</span><span class="v">${esc(r.delivery?.deliveryNo||'')}</span></div>
    <div class="item-line"><span class="l">Driver / Vehicle</span><span class="v">${esc(r.delivery?.driver||'')} · ${esc(r.delivery?.vehicle||'')}</span></div>
    <div class="item-line"><span class="l">Status</span><span class="v">Waiting for branch to confirm receipt</span></div>`;
  }
  return '';
}

function renderStockRow(item, qty){
  const key = item.key;
  const active = state.stockInDraft && state.stockInDraft.key===key;
  const threshold = key==='__rawChicken__' ? LOW_STOCK_THRESHOLDS.rawChicken : (LOW_STOCK_THRESHOLDS[key]||0);
  const status = qty<=0 ? 'out' : qty<=threshold ? 'low' : null;
  const qtyColor = status==='out' ? 'var(--red)' : status==='low' ? 'var(--amber)' : 'inherit';
  return `<div class="ticket" style="margin-bottom:10px;${status?`border-color:${status==='out'?'var(--red)':'var(--amber)'};`:''}">
    <div class="ticket-body" style="padding:12px 15px;">
      <div class="item-row" style="border-bottom:none;padding:2px 0;">
        <div class="item-label"><span class="item-emoji">${item.emoji}</span><span>${item.label}</span></div>
        <div class="item-input-wrap"><span class="v" style="font-family:var(--font-mono);font-weight:700;font-size:15px;color:${qtyColor};">${qty}</span><span class="item-unit">${item.unit}</span></div>
      </div>
      ${status?`<div style="font-size:11.5px;font-weight:700;color:${qtyColor};margin-top:2px;">${status==='out'?'⚠️ OUT OF STOCK':'⚠️ Low stock'}</div>`:''}
      ${active? `
        <div class="action-panel" style="margin-top:10px;">
          <label class="field-label">Add Stock (${item.unit})</label>
          <input type="number" min="0" step="0.5" class="other-input" style="width:100%;" data-field="stockin-qty" value="${state.stockInDraft.qty}">
          <div class="panel-row">
            <button class="btn-primary" data-action="confirm-stock-in">Add Stock</button>
            <button class="btn-secondary" data-action="cancel-stock-in">Cancel</button>
          </div>
        </div>
      ` : `<button class="btn-small ghost" style="margin-top:8px;" data-action="start-stock-in" data-key="${key}">+ Add Stock</button>`}
    </div>
  </div>`;
}

/* ================= PRODUCTION STAFF (limited access) ================= */
function currentStaff(){ return state.productionStaff.find(s=>s.id===state.currentStaffId); }
function greeting(){ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }

function renderStaffScreen(){
  if(state.staffScreen==='tasks') return renderStaffTasks();
  if(state.staffScreen==='myHistory') return renderStaffHistory();
  return '';
}

function renderStaffTasks(){
  const me = currentStaff();
  if(!me) return `<div class="empty-state"><div class="ic">⚠️</div><b>Account not found</b><span>Please log out and log in again.</span></div>`;
  const visible = state.productionTasks.filter(t=>{
    if(t.type==='SAUCE' && !me.canMakeSauce) return false;
    if(t.type==='INJECTION' && !me.canDoInjection) return false;
    if(t.status==='PENDING') return t.assignedStaffId===null || t.assignedStaffId===me.id;
    if(t.status==='ACCEPTED') return t.acceptedById===me.id;
    return false;
  }).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return `<h2 class="section-title">${greeting()}, ${esc(me.name)}!</h2>
  <p class="section-desc">Here are your production tasks.</p>
  ${visible.length? visible.map(renderStaffTaskCard).join('') : `<div class="empty-state"><div class="ic">✅</div><b>No tasks right now</b><span>New tasks assigned to you will show up here.</span></div>`}`;
}

function renderStaffTaskCard(t){
  const isSauce = t.type==='SAUCE';
  const expanded = state.staffExpandedId===t.id;
  return `<div class="ticket">
    <div class="ticket-head" data-action="toggle-staff-task-expand" data-id="${t.id}">
      <div><div class="ticket-id">${esc(t.id)}</div><div class="ticket-branch">${isSauce?'🥣 '+(esc(t.targetLabel)||'Sauce Task'):'🐔 Chicken Injection'}</div><div class="ticket-date">${fmtDate(t.createdAt)}</div></div>
      <span class="pill ${t.status==='PENDING'?'pending':'approved'}">${t.status==='PENDING'?'Pending':'In Progress'}</span>
    </div>

  const me = currentStaff();

  const mine = state.productionTasks.filter(t=>t.acceptedById===me.id && (t.status==='COMPLETED'||t.status==='REVIEWED')).sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));

/* ============== EVENT HANDLING ============== */
document.getElementById('app-outer').addEventListener('click', handleClick);
document.getElementById('app-outer').addEventListener('input', handleInput);
document.getElementById('app-outer').addEventListener('change', handleChange);

function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if(action==='login-tab'){ state.loginRoleTab = el.dataset.role; state.loginError=''; render(); return; }
  if(action==='login-branch'){ doBranchLogin(); return; }
  if(action==='login-admin'){ doAdminLogin(); return; }
  if(action==='login-production'){ doProductionLogin(); return; }
  if(action==='login-staff'){ doStaffLogin(); return; }
  if(action==='logout'){ doLogout(); return; }
  if(action==='nav'){ state.screen = el.dataset.screen; state.expandedId=null; render(); return; }
  if(action==='prod-nav'){ state.prodScreen = el.dataset.screen; state.prodExpandedId=null; render(); return; }
  if(action==='staff-nav'){ state.staffScreen = el.dataset.screen; state.staffExpandedId=null; render(); return; }

  if(action==='wizard-next'){ state.step = Math.min(4, state.step+1); render(); return; }
  if(action==='wizard-back'){ state.step = Math.max(1, state.step-1); render(); return; }
  if(action==='wizard-cancel'){
    if(confirm('Discard this request draft?')){ state.draft=null; state.step=1; state.screen='home'; }
    render(); return;
  }
  if(action==='add-other-item'){ state.draft.otherItems.push({id:genId('OTH'), name:'', qty:0, unit:''}); render(); return; }
  if(action==='remove-other-item'){ state.draft.otherItems = state.draft.otherItems.filter(o=>o.id!==id); render(); return; }
  if(action==='submit-request'){ submitRequest(); return; }

  if(action==='toggle-expand'){ state.expandedId = state.expandedId===id ? null : id; render(); return; }

  if(action==='branch-mark-received'){ markReceived(id); return; }

  if(action==='admin-start-approve'){
    const r = state.requests.find(x=>x.id===id);
    const approvedQtys = {}; STANDARD_ITEMS.forEach(i=>approvedQtys[i.key]=r.requested[i.key]);
    const approvedOther = {}; (r.otherItems||[]).forEach(o=>approvedOther[o.id]=o.qty);
    state.adminActions[id] = {mode:'approve', approvedQtys, approvedOther};
    render(); return;
  }
  if(action==='admin-start-reject'){ state.adminActions[id] = {mode:'reject', rejectReason:''}; render(); return; }
  if(action==='admin-start-dispatch'){
    state.adminActions[id] = {mode:'dispatch', deliveryNo:genId('DEL'), date:new Date().toISOString().slice(0,10), driver:'', vehicle:''};
    render(); return;
  }
  if(action==='admin-cancel-action'){ delete state.adminActions[id]; render(); return; }
  if(action==='admin-confirm-approve'){ confirmApprove(id); return; }
  if(action==='admin-confirm-reject'){ confirmReject(id); return; }
  if(action==='admin-confirm-dispatch'){ confirmDispatch(id); return; }

  if(action==='start-stock-in'){ state.stockInDraft = {key: el.dataset.key, qty:0}; render(); return; }
  if(action==='cancel-stock-in'){ state.stockInDraft = null; render(); return; }
  if(action==='confirm-stock-in'){ confirmStockIn(); return; }

  if(action==='add-sauce-other'){ state.sauceDraft.otherUsed.push({id:genId('SOTH'), name:'', qty:0, unit:''}); render(); return; }
  if(action==='remove-sauce-other'){ state.sauceDraft.otherUsed = state.sauceDraft.otherUsed.filter(o=>o.id!==id); render(); return; }
  if(action==='submit-sauce-batch'){ submitSauceBatch(); return; }
  if(action==='cancel-sauce-batch'){
    if(confirm('Discard this sauce batch draft?')){ state.sauceDraft=null; state.prodScreen='dashboard'; }
    render(); return;
  }

  if(action==='add-inj-other'){ state.injectionDraft.otherUsed.push({id:genId('IOTH'), name:'', qty:0, unit:''}); render(); return; }
  if(action==='remove-inj-other'){ state.injectionDraft.otherUsed = state.injectionDraft.otherUsed.filter(o=>o.id!==id); render(); return; }
  if(action==='submit-injection-batch'){ submitInjectionBatch(); return; }
  if(action==='cancel-injection-batch'){
    if(confirm('Discard this injection batch draft?')){ state.injectionDraft=null; state.prodScreen='dashboard'; }
    render(); return;
  }
  if(action==='toggle-prod-expand'){ state.prodExpandedId = state.prodExpandedId===id ? null : id; render(); return; }

  if(action==='accept-task'){ acceptTask(id); return; }
  if(action==='toggle-staff-task-expand'){ state.staffExpandedId = state.staffExpandedId===id ? null : id; render(); return; }
  if(action==='submit-staff-sauce'){ submitStaffSauce(id); return; }
  if(action==='submit-staff-injection'){ submitStaffInjection(id); return; }

  if(action==='toggle-task-expand'){ state.taskExpandedId = state.taskExpandedId===id ? null : id; render(); return; }
  if(action==='start-create-task'){
    const type = el.dataset.tasktype;
    state.taskCreateType = type;
    state.taskCreateDraft = type==='SAUCE'
      ? {assignedStaffId:'', targetLabel:'', requiredMaterials:Object.fromEntries(INGREDIENTS.map(i=>[i.key,0])), notes:''}
      : {assignedStaffId:'', chickenAssigned:0, sauceRequired:0, notes:''};
    render(); return;
  }
  if(action==='cancel-create-task'){ state.taskCreateType=null; state.taskCreateDraft=null; render(); return; }
  if(action==='confirm-create-task'){ createTask(); return; }
  if(action==='mark-task-reviewed'){ markTaskReviewed(id); return; }

  if(action==='start-create-staff'){ state.staffCreateOpen=true; state.staffCreateDraft={name:'', pin:'', canMakeSauce:true, canDoInjection:true}; render(); return; }
  if(action==='cancel-create-staff'){ state.staffCreateOpen=false; state.staffCreateDraft=null; render(); return; }
  if(action==='confirm-create-staff'){ createStaff(); return; }
  if(action==='toggle-staff-active'){ toggleStaffActive(id); return; }
  if(action==='go-back-dashboard'){
    if(state.role==='admin'){ state.screen='dashboard'; }
    else if(state.role==='production'){ state.prodScreen='dashboard'; }
    render(); return;
  }
}

/* login/logout only needs delegation set up once at top-level; re-declared safe no-op */
function attachAuthOnly(){ /* handled by global delegation already */ }

/* ============== ACTIONS ============== */
async function doBranchLogin(){
  let branch = state.loginBranchSelect;
  const passcode = state.loginBranchPasscode.trim();
  if(branch==='__other__'){
    const name = state.loginBranchOther.trim();
    if(!name){ state.loginError='Please specify the branch name.'; render(); return; }
    branch = name;
    if(!allBranches().includes(name)){
      if(!/^\d{4}$/.test(passcode)){ state.loginError='Set a 4-digit passcode for this new branch to continue.'; render(); return; }
      state.customBranches.push(name);
      state.customBranchPasscodes[name] = passcode;
      await saveCustomBranches();
    } else {
      const expected = BRANCH_PASSCODES[name] || state.customBranchPasscodes[name];
      if(passcode !== expected){ state.loginError='Incorrect passcode for this branch.'; render(); return; }
    }
  } else {
    const expected = BRANCH_PASSCODES[branch] || state.customBranchPasscodes[branch];
    if(passcode !== expected){ state.loginError='Incorrect passcode for this branch.'; render(); return; }
  }
  state.role='branch'; state.branch=branch; state.screen='home'; state.loginError=''; state.loginBranchPasscode='';
  render();
}
function doAdminLogin(){
  if(state.loginAdminPass !== ADMIN_PASSCODE){ state.loginError='Incorrect passcode. Please try again.'; render(); return; }
  state.role='admin'; state.screen='dashboard'; state.loginError=''; state.loginAdminPass='';
  render();
}
function doProductionLogin(){
  if(state.loginProductionPass !== PRODUCTION_PASSCODE){ state.loginError='Incorrect passcode. Please try again.'; render(); return; }
  state.role='production'; state.prodScreen='dashboard'; state.loginError=''; state.loginProductionPass='';
  render();
}
function doStaffLogin(){
  const list = state.productionStaff.filter(s=>s.active!==false);
  if(!list.length){ state.loginError='No staff accounts yet.'; render(); return; }
  const id = state.loginStaffId || list[0].id;
  const staff = list.find(s=>s.id===id);
  if(!staff){ state.loginError='Please select your name.'; render(); return; }
  if(staff.pin !== state.loginStaffPin.trim()){ state.loginError='Incorrect passcode. Please try again.'; render(); return; }
  state.role='staff'; state.currentStaffId=staff.id; state.staffScreen='tasks'; state.loginError=''; state.loginStaffPin='';
  render();
}
function doLogout(){
  state.role=null; state.branch=null; state.screen='home'; state.draft=null; state.step=1;
  state.loginBranchSelect=DEFAULT_BRANCHES[0]; state.loginBranchOther=''; state.loginBranchPasscode='';
  state.loginAdminPass=''; state.loginProductionPass=''; state.loginStaffId=''; state.loginStaffPin=''; state.loginError='';
  state.expandedId=null; state.adminActions={};
  state.prodScreen='dashboard'; state.stockInDraft=null; state.sauceDraft=null; state.injectionDraft=null; state.prodExpandedId=null;
  state.currentStaffId=null; state.staffScreen='tasks'; state.staffTaskDrafts={}; state.staffExpandedId=null;
  state.taskExpandedId=null; state.taskCreateType=null; state.taskCreateDraft=null; state.staffCreateOpen=false; state.staffCreateDraft=null;
  render();
}

async function submitRequest(){
  const d = state.draft;
  const now = todayISO();
  const req = {
    id: genId('REQ'),
    branch: state.branch,
    createdAt: now,
    status: 'PENDING',
    balance: {...d.balance},
    requested: {...d.requested},
    approved: null,
    otherItems: d.otherItems.filter(o=>o.name.trim()!=='').map(o=>({...o, approvedQty:null})),
    delivery: null,
    rejectReason: null,
    receivedAt: null,
    history: [{status:'PENDING', at:now}]
  };
  state.requests.push(req);
  await saveRequests();
  state.draft = null; state.step = 1;
  state.banner = {type:'success', icon:'✅', text:`Request ${req.id} submitted to admin.`};
  state.screen = 'history';
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 4000);
}

async function confirmApprove(id){
  const r = state.requests.find(x=>x.id===id);
  const act = state.adminActions[id];
  r.approved = {...act.approvedQtys};
  (r.otherItems||[]).forEach(o=>{ o.approvedQty = act.approvedOther[o.id] ?? o.qty; });
  r.status = 'APPROVED';
  r.history.push({status:'APPROVED', at:todayISO()});
  delete state.adminActions[id];
  await saveRequests();
  state.banner = {type:'success', icon:'✔', text:`${r.id} approved.`};
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 3000);
}
async function confirmReject(id){
  const r = state.requests.find(x=>x.id===id);
  const act = state.adminActions[id];
  r.status = 'REJECTED';
  r.rejectReason = act.rejectReason || '(no reason given)';
  r.history.push({status:'REJECTED', at:todayISO()});
  delete state.adminActions[id];
  await saveRequests();
  state.banner = {type:'info', icon:'✕', text:`${r.id} rejected.`};
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 3000);
}
async function confirmDispatch(id){
  const r = state.requests.find(x=>x.id===id);
  const act = state.adminActions[id];
  r.delivery = {deliveryNo:act.deliveryNo, date:act.date, driver:act.driver, vehicle:act.vehicle};
  r.status = 'OUT_FOR_DELIVERY';
  r.history.push({status:'OUT_FOR_DELIVERY', at:todayISO()});
  delete state.adminActions[id];
  await saveRequests();
  state.banner = {type:'success', icon:'🚚', text:`${r.id} is out for delivery.`};
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 3000);
}
async function markReceived(id){
  const r = state.requests.find(x=>x.id===id);
  r.status = 'RECEIVED';
  r.receivedAt = todayISO();
  r.history.push({status:'RECEIVED', at:r.receivedAt});
  await saveRequests();
  state.banner = {type:'success', icon:'📍', text:`Marked ${r.id} as received.`};
  state.screen = 'history';
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 3000);
}

async function confirmStockIn(){
  const {key, qty} = state.stockInDraft;
  if(key==='__rawChicken__') state.rawChickenPcs += qty;
  else state.ingredientStock[key] = (state.ingredientStock[key]||0) + qty;
  await saveProduction();
  state.stockInDraft = null;
  state.banner = {type:'success', icon:'📦', text:'Stock added.'};
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 3000);
}

async function submitSauceBatch(){
  const d = state.sauceDraft;
  INGREDIENTS.forEach(i=>{ state.ingredientStock[i.key] = (state.ingredientStock[i.key]||0) - (d.used[i.key]||0); });
  const produced = parseFloat(d.producedLiters)||0;
  state.sauceLiters += produced;
  const batch = {
    id: genId('BATCH'), type:'SAUCE', batchNo:d.batchNo, date:d.date, recordedBy:d.recordedBy,
    used:{...d.used}, otherUsed: d.otherUsed.filter(o=>o.name.trim()!==''), producedLiters: produced,
    createdAt: todayISO()
  };
  state.productionBatches.push(batch);
  await saveProduction();
  state.sauceDraft = null;
  state.banner = {type:'success', icon:'🥣', text:`Sauce batch ${batch.batchNo} logged.`};
  state.prodScreen = 'prodHistory';
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 4000);
}

async function submitInjectionBatch(){
  const d = state.injectionDraft;
  const chicken = parseFloat(d.chickenUsed)||0;
  const sauce = parseFloat(d.sauceUsed)||0;
  state.rawChickenPcs -= chicken;
  state.sauceLiters -= sauce;
  state.injectedChickenPcs += chicken;
  const batch = {
    id: genId('BATCH'), type:'INJECTION', batchNo:d.batchNo, date:d.date, recordedBy:d.recordedBy,
    chickenUsed: chicken, sauceUsed: sauce, otherUsed: d.otherUsed.filter(o=>o.name.trim()!==''),
    createdAt: todayISO()
  };
  state.productionBatches.push(batch);
  await saveProduction();
  state.injectionDraft = null;
  state.banner = {type:'success', icon:'🐔', text:`Injection batch ${batch.batchNo} logged.`};
  state.prodScreen = 'prodHistory';
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 4000);
}

/* ============== TASKS & STAFF ACTIONS ============== */
async function acceptTask(id){
  const t = state.productionTasks.find(x=>x.id===id);
  const me = currentStaff();
  if(!t || !me) return;
  t.status='ACCEPTED'; t.acceptedById=me.id; t.acceptedByName=me.name; t.acceptedAt=todayISO();
  await saveProductionTasks();
  render();
}

async function submitStaffSauce(taskId){
  const t = state.productionTasks.find(x=>x.id===taskId);
  const d = state.staffTaskDrafts[taskId];
  const me = currentStaff();
  if(!t || !d || !me) return;
  Object.keys(d.used).forEach(key=>{ state.ingredientStock[key] = (state.ingredientStock[key]||0) - (d.used[key]||0); });
  const otherUsed = d.otherName && d.otherName.trim()!=='' ? [{name:d.otherName.trim(), qty:parseFloat(d.otherQty)||0, unit:d.otherUnit||''}] : [];
  const produced = parseFloat(d.producedLiters)||0;
  state.sauceLiters += produced;
  const batch = { id: genId('BATCH'), type:'SAUCE', batchNo:t.id, date:new Date().toISOString().slice(0,10), recordedBy: me.name, used:{...d.used}, otherUsed, producedLiters: produced, createdAt: todayISO(), taskId:t.id };
  state.productionBatches.push(batch);
  t.status='COMPLETED'; t.completedAt=todayISO(); t.actualUsed={...d.used}; t.producedLiters=produced; t.batchId=batch.id;
  await saveProduction();
  await saveProductionTasks();
  delete state.staffTaskDrafts[taskId];
  state.staffExpandedId=null;
  state.banner={type:'success',icon:'🥣',text:'Production submitted for review.'};
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 4000);
}

async function submitStaffInjection(taskId){
  const t = state.productionTasks.find(x=>x.id===taskId);
  const d = state.staffTaskDrafts[taskId];
  const me = currentStaff();
  if(!t || !d || !me) return;
  const actual = parseFloat(d.actualInjected)||0;
  const sauceUsed = parseFloat(d.sauceUsed)||0;
  const damaged = parseFloat(d.damaged)||0;
  state.rawChickenPcs -= (actual+damaged);
  state.sauceLiters -= sauceUsed;
  state.injectedChickenPcs += actual;
  const batch = { id: genId('BATCH'), type:'INJECTION', batchNo:t.id, date:new Date().toISOString().slice(0,10), recordedBy: me.name, chickenUsed: actual, sauceUsed, otherUsed:[], damaged, reason: d.reason, createdAt: todayISO(), taskId:t.id };
  state.productionBatches.push(batch);
  t.status='COMPLETED'; t.completedAt=todayISO(); t.actualInjected=actual; t.sauceUsedActual=sauceUsed; t.damaged=damaged; t.damagedReason=d.reason; t.batchId=batch.id;
  await saveProduction();
  await saveProductionTasks();
  delete state.staffTaskDrafts[taskId];
  state.staffExpandedId=null;
  state.banner={type:'success',icon:'🐔',text:'Injection submitted for review.'};
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 4000);
}

async function createTask(){
  const type = state.taskCreateType;
  const d = state.taskCreateDraft;
  const task = {
    id: genId('PR'), type, createdAt: todayISO(), requestedBy: state.role==='admin'?'Admin':'Production Manager',
    assignedStaffId: d.assignedStaffId || null, notes: d.notes||'',
    status:'PENDING', acceptedById:null, acceptedByName:null, acceptedAt:null, completedAt:null, batchId:null
  };
  if(type==='SAUCE'){ task.targetLabel = d.targetLabel||''; task.requiredMaterials = {...d.requiredMaterials}; task.actualUsed=null; task.producedLiters=null; }
  else { task.chickenAssigned = parseFloat(d.chickenAssigned)||0; task.sauceRequired = parseFloat(d.sauceRequired)||0; task.actualInjected=null; task.sauceUsedActual=null; task.damaged=null; task.damagedReason=null; }
  state.productionTasks.push(task);
  await saveProductionTasks();
  state.taskCreateType=null; state.taskCreateDraft=null;
  state.banner={type:'success', icon:'📝', text:`Task ${task.id} created.`};
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 3000);
}

async function markTaskReviewed(id){
  const t = state.productionTasks.find(x=>x.id===id);
  if(!t) return;
  t.status='REVIEWED'; t.reviewedAt=todayISO();
  await saveProductionTasks();
  state.banner={type:'success', icon:'✔', text:`${t.id} marked as reviewed.`};
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 3000);
}

async function createStaff(){
  const d = state.staffCreateDraft;
  if(!d.name.trim() || !d.pin.trim()){ state.banner={type:'info', icon:'⚠️', text:'Name and PIN are required.'}; render(); setTimeout(()=>{ state.banner=null; render(); }, 3000); return; }
  const staff = { id: genId('STF'), name: d.name.trim(), pin: d.pin.trim(), canMakeSauce: !!d.canMakeSauce, canDoInjection: !!d.canDoInjection, active:true };
  state.productionStaff.push(staff);
  await saveProductionStaff();
  state.staffCreateOpen=false; state.staffCreateDraft=null;
  state.banner={type:'success', icon:'👷', text:`${staff.name} added.`};
  render();
  setTimeout(()=>{ state.banner=null; render(); }, 3000);
}

async function toggleStaffActive(id){
  const s = state.productionStaff.find(x=>x.id===id);
  if(!s) return;
  s.active = s.active===false ? true : false;
  await saveProductionStaff();
  render();
}

/* ============== INIT ============== */
async function init(){
  render();
  state.requests = await loadRequests();
  state.customBranches = (await loadCustomBranches());
  state.customBranchPasscodes = state.customBranches.passcodes || {};
  state.customBranches = state.customBranches.items || [];
  const prod = await loadProduction();
  state.ingredientStock = prod.ingredientStock;
  state.sauceLiters = prod.sauceLiters;
  state.rawChickenPcs = prod.rawChickenPcs;
  state.injectedChickenPcs = prod.injectedChickenPcs;
  state.productionBatches = prod.productionBatches;
  state.productionStaff = await loadProductionStaff();
  state.productionTasks = await loadProductionTasks();
  state.loaded = true;
  render();
  setupRealtimeSync();
}
init();
</script>
